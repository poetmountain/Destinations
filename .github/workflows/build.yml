name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Swift ${{ matrix.swift }} (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.2"
            swift: "6.0"
            runner: macos-15
          - xcode: "16.3"
            swift: "6.1"
            runner: macos-15
          - xcode: "26.3"
            swift: "6.2"
            runner: macos-26
          - xcode: "26.6"
            swift: "6.3"
            runner: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Ensure iOS platform is registered
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme Destinations \
            -destination 'generic/platform=iOS'
