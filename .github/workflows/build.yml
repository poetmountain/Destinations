name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Swift ${{ matrix.swift }} (${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: "/Applications/${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_16.2"
            swift: "6.0"
            runner: macos-15
          - xcode: "Xcode_16.3"
            swift: "6.1"
            runner: macos-15
          - xcode: "Xcode_26.3"
            swift: "6.2"
            runner: macos-26
          - xcode: "Xcode_26.6"
            swift: "6.3"
            runner: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Ensure iOS platform is available
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme Destinations \
            -destination 'generic/platform=iOS'
